name: Generate Google-compatible portrait favicon

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  favicon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Create a square PNG from the existing portrait
        run: |
          python - <<'PY'
          from PIL import Image
          im = Image.open('assets/potrait.jpg').convert('RGB')
          w, h = im.size
          box = (int(w*0.16), int(h*0.335), int(w*0.54), int(h*0.335)+int(w*0.38))
          face = im.crop(box).resize((96,96), Image.Resampling.LANCZOS)
          face.save('assets/favicon.png', optimize=True)
          PY
      - name: Upload result for review (do not push automatically)
        uses: actions/upload-artifact@v4
        with:
          name: favicon-preview
          path: assets/favicon.png
